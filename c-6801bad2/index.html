<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>And G 収支シミュレーター</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--sub:#6e6e73;--line:#d1d1d6;--accent:#007aff;--good:#248a3d;--bad:#d70015;--field:#f2f2f7;--shadow:0 1px 2px rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#98989d;--line:#38383a;--accent:#0a84ff;--good:#30d158;--bad:#ff453a;--field:#2c2c2e;--shadow:none}}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.45;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}button{touch-action:manipulation}.shell{max-width:720px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:1.22rem;letter-spacing:-.02em}.brand span{font-size:.74rem;color:var(--sub)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.quick div{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow)}.quick small{display:block;color:var(--sub);font-size:.65rem;white-space:nowrap}.quick b{display:block;margin-top:2px;font-size:.95rem;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.page{padding:18px 16px 24px}.pane{display:none}.pane.active{display:block}.section-title{margin:24px 4px 8px;color:var(--sub);font-size:.76rem;font-weight:600;letter-spacing:.02em}.section-title:first-child{margin-top:0}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}.row{min-height:52px;padding:9px 13px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.label{font-size:.93rem}.hint{display:block;color:var(--sub);font-size:.72rem;margin-top:2px}.value{color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
input[type=number],input[type=text],select{border:0;border-radius:9px;background:var(--field);color:var(--ink);min-height:36px;padding:7px 9px;outline:none}input[type=number]{width:104px;text-align:right;font-variant-numeric:tabular-nums}input[type=text]{width:100%}select{max-width:170px}input:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
.unit{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:.82rem}.unit input{color:var(--ink)}
.switch{position:relative;width:50px;height:30px;flex:none}.switch input{position:absolute;opacity:0}.switch i{position:absolute;inset:0;border-radius:99px;background:#e9e9ea;transition:.18s}.switch i:after{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.18s}.switch input:checked+i{background:var(--good)}.switch input:checked+i:after{transform:translateX(20px)}
.seg{display:flex;background:var(--field);padding:2px;border-radius:9px;gap:2px}.seg button{border:0;background:transparent;color:var(--sub);border-radius:7px;padding:7px 10px;font-size:.78rem;font-weight:600}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.subfields{padding:0 13px 10px 75px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.subfields.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field label{display:block;color:var(--sub);font-size:.66rem;margin:0 0 3px 2px}.field input,.field select{width:100%;max-width:none}.span2{grid-column:1/-1}
.rangebox{padding:12px 13px}.range-line{display:flex;align-items:center;gap:12px}.range-line input[type=range]{flex:1;accent-color:var(--accent)}.range-line input[type=number]{width:112px;font-size:1.05rem;font-weight:650}
.item{padding:12px 13px;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item-head{display:flex;align-items:center;gap:10px}.item-head input[type=text]{flex:1;font-weight:600;background:transparent;padding-left:0}.remove{border:0;background:transparent;color:var(--bad);padding:7px;font-size:.78rem}.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 0 60px}.item-grid .wide{grid-column:1/-1}.mini-switch{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:.75rem}.mini-switch input{width:18px;height:18px;accent-color:var(--good)}
.add{width:100%;border:0;border-top:1px solid var(--line);background:var(--card);color:var(--accent);padding:13px;font-weight:600}.notice{border-radius:12px;padding:11px 13px;font-size:.78rem;margin:10px 0}.notice.warn{color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card))}.notice.good{color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--card))}
.result-hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.result-hero small{color:var(--sub)}.result-hero strong{display:block;font-size:2.15rem;line-height:1.15;letter-spacing:-.05em;margin:3px 0;font-variant-numeric:tabular-nums}.result-hero .good{color:var(--good)}.result-hero .bad{color:var(--bad)}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}.metric small{display:block;color:var(--sub);font-size:.7rem}.metric b{display:block;font-size:1.15rem;margin-top:3px;font-variant-numeric:tabular-nums}.metric.wide{grid-column:1/-1}
.breakdown .row{min-height:44px}.breakdown .row.total{font-weight:700}.breakdown .row.bad .value{color:var(--bad)}.breakdown .row.good .value{color:var(--good)}
.table-scroll{overflow-x:auto}.simple-table{width:100%;border-collapse:collapse;font-size:.8rem}.simple-table th,.simple-table td{padding:10px 9px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.simple-table tr:first-child th{border-top:0}.simple-table th:first-child,.simple-table td:first-child{text-align:left}.simple-table th{color:var(--sub);font-weight:500}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.actions button{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:12px;padding:13px;font-weight:600}.actions .danger{color:var(--bad)}
.preset-select{width:58%;max-width:260px;flex:none}.preset-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 13px 13px;border-top:1px solid var(--line)}.preset-actions button{border:0;background:var(--field);color:var(--accent);border-radius:10px;min-height:40px;padding:8px 5px;font-size:.8rem;font-weight:600}.preset-actions button.danger{color:var(--bad)}.preset-actions button:disabled{opacity:.35}.file-input{display:none}
.legal{color:var(--sub);font-size:.68rem;line-height:1.55;margin:20px 5px}.legal a{color:inherit}.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:7px max(10px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom))}.nav-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:var(--sub);padding:7px 2px 4px;font-size:.68rem}.nav button b{display:block;font-size:1.05rem;line-height:1.1;margin-bottom:3px;font-weight:600}.nav button.on{color:var(--accent)}.hidden{display:none!important}
@media(min-width:680px){.page{padding-left:28px;padding-right:28px}.subfields{grid-template-columns:repeat(4,minmax(0,1fr))}.subfields.three{grid-template-columns:repeat(3,minmax(0,1fr))}.item-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.item-grid .wide{grid-column:auto}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric.wide{grid-column:auto}.preset-actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:390px){.quick small{font-size:.6rem}.quick b{font-size:.84rem}.subfields,.subfields.three{padding-left:13px}.item-grid{margin-left:0}.brand span{display:none}}
@media print{body{padding:0}.top{position:static}.nav,.actions,.add,.remove,.switch,.seg{display:none!important}.pane{display:block!important}.page{padding:10px}.group,.metric,.result-hero{break-inside:avoid;box-shadow:none}.section-title{margin-top:18px}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand"><h1>And G 収支シミュレーター</h1><span id="saveState">自動保存</span></div><div class="quick"><div><small>損益分岐</small><b id="qBreakEven">—</b></div><div><small>必要客数／日</small><b id="qGuests">—</b></div><div><small>想定利益</small><b id="qProfit">—</b></div></div></header><main class="page"><section class="pane active" data-pane="price" id="pricePane"></section><section class="pane" data-pane="pay" id="payPane"></section><section class="pane" data-pane="cost" id="costPane"></section><section class="pane" data-pane="result" id="resultPane"></section></main></div>
<nav class="nav" aria-label="画面切り替え"><div class="nav-inner"><button class="on" data-tab="price"><b>¥</b>料金</button><button data-tab="pay"><b>人</b>給与</button><button data-tab="cost"><b>−</b>経費</button><button data-tab="result"><b>＝</b>結果</button></div></nav>
<script>
'use strict';
const KEY='andg-simulator-v2',PRESET_KEY='andg-simulator-presets-v1',ACTIVE_PRESET_KEY='andg-simulator-active-preset-v1';const uid=p=>p+'-'+Math.random().toString(36).slice(2,9);const clone=o=>JSON.parse(JSON.stringify(o));const money=n=>(Number.isFinite(n)?Math.round(n):0).toLocaleString('ja-JP')+'円';const man=n=>Number.isFinite(n)?(n/10000).toFixed(n>=1000000?0:1)+'万円':'—';const pct=n=>Number.isFinite(n)?n.toFixed(1)+'%':'—';const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const n=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:0};
const DEFAULT={version:2,target:3000000,days:26,taxRate:10,priceMode:'included',serviceRate:10,mix:{set:45,drink:30,shot:5,bottle:20,option:0},standard:{enabled:true,name:'通常セット',price:4000,minutes:60,avgSets:1,share:100},bottlePlan:{enabled:false,name:'ボトルキープ',price:3000,timeMode:'unlimited',minutes:60,avgSets:1,share:0},drinks:[{id:'drink-1',enabled:false,name:'ドリンク1',price:0,cost:0,mode:'included',scope:'standard',qtyPerSet:1,mix:100,backEnabled:false,backType:'fixed',backValue:0}],shots:[{id:'shot-1',enabled:false,name:'ショット1',price:0,cost:0,mix:100,backEnabled:false,backType:'fixed',backValue:0}],bottles:[{id:'bottle-1',enabled:false,name:'ボトル・シャンパン1',price:0,cost:0,mix:100,backEnabled:false,backType:'percent',backValue:0}],options:[{id:'nomination',enabled:false,name:'本指名',unit:'1人・1セット',price:0,mix:25,backEnabled:false,backType:'fixed',backValue:0},{id:'inside',enabled:false,name:'場内指名',unit:'1人・1セット',price:0,mix:25,backEnabled:false,backType:'fixed',backValue:0},{id:'accompany',enabled:false,name:'同伴',unit:'1人',price:0,mix:25,backEnabled:false,backType:'fixed',backValue:0},{id:'karaoke',enabled:false,name:'カラオケ',unit:'1組',price:0,mix:25,backEnabled:false,backType:'fixed',backValue:0}],setBack:{enabled:false,type:'percent',value:0},staffing:{enabled:true,wage:1600,hours:4,weekdayStaff:3,weekdayDays:18,weekendStaff:5,weekendDays:8},manager:{enabled:true,fixed:250000},allowances:[{id:'allow-1',enabled:false,name:'皆勤・精勤など',amount:0}],profitShare:{enabled:false,threshold:3000000,reserve:300000,castRate:20,managerRate:15},fixedCosts:[{id:'rent',enabled:true,name:'家賃',amount:185000},{id:'utility',enabled:true,name:'水道光熱費',amount:40000},{id:'net',enabled:true,name:'通信費',amount:10000},{id:'karaoke-lease',enabled:true,name:'カラオケ',amount:25000},{id:'driver',enabled:false,name:'送迎',amount:50000},{id:'other-fixed',enabled:false,name:'その他固定費',amount:0}],variableCosts:[{id:'card',enabled:false,name:'Square等の決済手数料',rate:2.5},{id:'tax-payment',enabled:false,name:'消費税納付分',rate:0},{id:'other-variable',enabled:false,name:'その他変動費',rate:0}],bill:{people:1,course:'standard',sets:1,items:{},options:{}}};
let state=load(),presets=loadPresets(),activePresetId=localStorage.getItem(ACTIVE_PRESET_KEY)||'',active='price';if(!presets.some(x=>x.id===activePresetId))activePresetId='';function merge(base,saved){if(Array.isArray(base))return Array.isArray(saved)?saved:base;if(base&&typeof base==='object'){const out={...base};if(saved&&typeof saved==='object'&&!Array.isArray(saved))Object.keys(saved).forEach(k=>{out[k]=k in base?merge(base[k],saved[k]):saved[k]});return out}return saved===undefined?base:saved}function normalizeState(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('設定形式が正しくありません');const out=merge(clone(DEFAULT),raw);['drinks','shots','bottles','options','allowances','fixedCosts','variableCosts'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=clone(DEFAULT[k]);out[k]=out[k].filter(x=>x&&typeof x==='object'&&!Array.isArray(x))});return out}function load(){try{return normalizeState(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return clone(DEFAULT)}}function loadPresets(){try{const rows=JSON.parse(localStorage.getItem(PRESET_KEY)||'[]');if(!Array.isArray(rows))return[];return rows.slice(0,100).filter(x=>x&&typeof x==='object'&&typeof x.name==='string'&&x.state).map(x=>({id:String(x.id||uid('preset')),name:x.name.trim().slice(0,60)||'名称未設定',updatedAt:x.updatedAt||'',state:normalizeState(x.state)}))}catch(e){return[]}}function flash(label='保存済み'){const el=document.getElementById('saveState');if(el){el.textContent=label;setTimeout(()=>el.textContent='自動保存',900)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));flash()}catch(e){}}function savePresets(){try{localStorage.setItem(PRESET_KEY,JSON.stringify(presets));localStorage.setItem(ACTIVE_PRESET_KEY,activePresetId);flash('マイセット保存済み')}catch(e){alert('保存できませんでした')}}function get(path){return path.split('.').reduce((o,k)=>o?.[k],state)}function set(path,value){const ks=path.split('.');let o=state;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=value}
function presetName(message,value=''){const answer=prompt(message,value);if(answer===null)return null;const name=answer.trim().slice(0,60);if(!name){alert('名前を入力してください');return null}return name}function selectedPreset(){return presets.find(x=>x.id===activePresetId)}function renderPresetPanel(){const selected=selectedPreset(),disabled=selected?'':' disabled';return `<div class="section-title">マイセット</div><div class="group"><div class="row"><div class="grow"><div class="label">保存した設定</div><small class="hint">この端末に保存</small></div><select class="preset-select" data-preset-select aria-label="マイセット"><option value="" ${selected?'':'selected'}>編集中（自動保存）</option>${presets.map(x=>`<option value="${esc(x.id)}" ${x.id===activePresetId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="preset-actions"><button data-preset-action="new">新規保存</button><button data-preset-action="overwrite"${disabled}>上書き</button><button data-preset-action="duplicate"${disabled}>複製</button><button data-preset-action="rename"${disabled}>名前変更</button><button data-preset-action="delete" class="danger"${disabled}>削除</button><button data-preset-action="export">書き出し</button><button data-preset-action="import">読み込み</button><input class="file-input" type="file" accept="application/json,.json" data-preset-import></div></div>`}function createPreset(){const name=presetName('マイセット名','新しい設定');if(name===null)return;const row={id:uid('preset'),name,updatedAt:new Date().toISOString(),state:clone(state)};presets.push(row);activePresetId=row.id;savePresets();renderAll()}function overwritePreset(){const row=selectedPreset();if(!row)return;row.state=clone(state);row.updatedAt=new Date().toISOString();savePresets();renderAll()}function loadPreset(id){const row=presets.find(x=>x.id===id);if(!row){activePresetId='';localStorage.setItem(ACTIVE_PRESET_KEY,'');renderAll();return}state=normalizeState(clone(row.state));activePresetId=row.id;save();savePresets();renderAll()}function duplicatePreset(){const row=selectedPreset();if(!row)return;const name=presetName('複製するマイセット名',row.name+' コピー');if(name===null)return;const copy={id:uid('preset'),name,updatedAt:new Date().toISOString(),state:clone(state)};presets.push(copy);activePresetId=copy.id;savePresets();renderAll()}function renamePreset(){const row=selectedPreset();if(!row)return;const name=presetName('新しい名前',row.name);if(name===null)return;row.name=name;row.updatedAt=new Date().toISOString();savePresets();renderAll()}function deletePreset(){const row=selectedPreset();if(!row||!confirm(`「${row.name}」を削除しますか？`))return;presets=presets.filter(x=>x.id!==row.id);activePresetId='';savePresets();renderAll()}function exportPresets(){const payload={format:'andg-presets-v1',exportedAt:new Date().toISOString(),current:state,presets},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='AndG_マイセット_'+new Date().toLocaleDateString('sv-SE')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importPresets(file){try{const payload=JSON.parse(await file.text());if(payload?.format!=='andg-presets-v1'||!Array.isArray(payload.presets)||!payload.current)throw new Error('And Gのバックアップファイルではありません');const imported=payload.presets.slice(0,100).map(x=>{if(!x||typeof x.name!=='string'||!x.state)throw new Error('マイセットの形式が正しくありません');return{id:uid('preset'),name:x.name.trim().slice(0,60)||'名称未設定',updatedAt:x.updatedAt||new Date().toISOString(),state:normalizeState(x.state)}}),current=normalizeState(payload.current);if(!confirm(`マイセット${imported.length}件と編集中の設定を復元しますか？`))return;state=current;presets=imported;activePresetId='';active='price';save();savePresets();renderAll();alert('読み込みました')}catch(e){alert('読み込めませんでした。\n'+e.message)}}
function sw(path,label,sub=''){return `<div class="row"><div class="grow"><div class="label">${label}</div>${sub?`<small class="hint">${sub}</small>`:''}</div><label class="switch"><input type="checkbox" data-bind="${path}" ${get(path)?'checked':''}><i></i></label></div>`}function numberField(path,label,unit='',step=1){return `<div class="field"><label>${label}</label><div class="unit"><input type="number" inputmode="decimal" data-bind="${path}" value="${get(path)}" step="${step}">${unit}</div></div>`}function rowNumber(path,label,unit='',step=1,sub=''){return `<div class="row"><div class="grow"><div class="label">${label}</div>${sub?`<small class="hint">${sub}</small>`:''}</div><div class="unit"><input type="number" inputmode="decimal" data-bind="${path}" value="${get(path)}" step="${step}">${unit}</div></div>`}function seg(path,choices){const v=get(path);return `<div class="seg">${choices.map(([x,l])=>`<button type="button" data-set="${path}" data-value="${x}" class="${v===x?'on':''}">${l}</button>`).join('')}</div>`}
function itemCard(item,kind,index){const base=`${kind}.${index}`,isDrink=kind==='drinks';return `<div class="item"><div class="item-head"><label class="switch"><input type="checkbox" data-bind="${base}.enabled" ${item.enabled?'checked':''}><i></i></label><input type="text" data-bind="${base}.name" value="${esc(item.name)}" aria-label="品名"><button class="remove" data-remove="${kind}" data-index="${index}">削除</button></div><div class="item-grid ${item.enabled?'':'hidden'}">${numberField(`${base}.price`,'店売り価格','円',100)}${numberField(`${base}.cost`,'原価','円',10)}${isDrink?`<div class="field wide"><label>扱い</label>${seg(`${base}.mode`,[['included','飲み放題'],['paid','有料']])}</div>`:''}${isDrink&&item.mode==='included'?`<div class="field"><label>対象セット</label><select data-bind="${base}.scope"><option value="standard" ${item.scope==='standard'?'selected':''}>通常</option><option value="bottle" ${item.scope==='bottle'?'selected':''}>ボトル</option><option value="both" ${item.scope==='both'?'selected':''}>両方</option></select></div>${numberField(`${base}.qtyPerSet`,'平均杯数／セット','杯',.1)}`:numberField(`${base}.mix`,'商品構成比','%',1)}<div class="wide mini-switch"><input type="checkbox" data-bind="${base}.backEnabled" ${item.backEnabled?'checked':''}>バックを設定</div>${item.backEnabled?`<div class="field"><label>バック方式</label><select data-bind="${base}.backType"><option value="fixed" ${item.backType==='fixed'?'selected':''}>1点ごと</option><option value="percent" ${item.backType==='percent'?'selected':''}>売上率</option></select></div>${numberField(`${base}.backValue`,'バック',item.backType==='fixed'?'円':'%',item.backType==='fixed'?50:1)}`:''}</div></div>`}
function optionCard(item,index){const base=`options.${index}`;return `<div class="item"><div class="item-head"><label class="switch"><input type="checkbox" data-bind="${base}.enabled" ${item.enabled?'checked':''}><i></i></label><div class="grow"><b>${esc(item.name)}</b><small class="hint">${item.unit}</small></div></div><div class="item-grid ${item.enabled?'':'hidden'}">${numberField(`${base}.price`,'料金','円',100)}${numberField(`${base}.mix`,'項目内構成比','%',1)}<div class="wide mini-switch"><input type="checkbox" data-bind="${base}.backEnabled" ${item.backEnabled?'checked':''}>バックを設定</div>${item.backEnabled?`<div class="field"><label>バック方式</label><select data-bind="${base}.backType"><option value="fixed" ${item.backType==='fixed'?'selected':''}>1件ごと</option><option value="percent" ${item.backType==='percent'?'selected':''}>売上率</option></select></div>${numberField(`${base}.backValue`,'バック',item.backType==='fixed'?'円':'%',item.backType==='fixed'?50:1)}`:''}</div></div>`}function genericItem(item,kind,index,key,unit){const base=`${kind}.${index}`;return `<div class="item"><div class="item-head"><label class="switch"><input type="checkbox" data-bind="${base}.enabled" ${item.enabled?'checked':''}><i></i></label><input type="text" data-bind="${base}.name" value="${esc(item.name)}"><button class="remove" data-remove="${kind}" data-index="${index}">削除</button></div><div class="item-grid ${item.enabled?'':'hidden'}">${numberField(`${base}.${key}`,unit==='%'?'率':'金額',unit,unit==='%'?.1:100)}</div></div>`}
function renderPrice(){document.getElementById('pricePane').innerHTML=`<div class="section-title">月間目標</div><div class="group"><div class="rangebox"><div class="range-line"><input type="range" min="500000" max="10000000" step="100000" data-bind="target" value="${state.target}"><input type="number" inputmode="numeric" step="100000" data-bind="target" value="${state.target}"></div><small class="hint">10万円単位・自由入力</small></div>${rowNumber('days','営業日数','日',1)}</div><div class="section-title">表示方法</div><div class="group"><div class="row"><div class="grow"><div class="label">価格表示</div></div>${seg('priceMode',[['included','税・サ込'],['service','税込＋サービス料']])}</div>${rowNumber('taxRate','消費税率','%',1)}${state.priceMode==='service'?rowNumber('serviceRate','サービス料','%',1):''}</div><div class="section-title">通常セット</div><div class="group">${sw('standard.enabled','通常セット')}<div class="subfields ${state.standard.enabled?'':'hidden'}">${numberField('standard.price','1人料金','円',100)}${numberField('standard.minutes','時間','分',5)}${numberField('standard.avgSets','平均セット数／人','',.1)}${numberField('standard.share','利用者構成比','%',1)}</div></div><div class="section-title">ボトルキープ</div><div class="group">${sw('bottlePlan.enabled','ボトルキープ')}<div class="subfields ${state.bottlePlan.enabled?'':'hidden'}">${numberField('bottlePlan.price','1人料金','円',100)}<div class="field"><label>滞在時間</label>${seg('bottlePlan.timeMode',[['unlimited','無制限'],['limited','時間制']])}</div>${state.bottlePlan.timeMode==='limited'?numberField('bottlePlan.minutes','1セット','分',5):''}${state.bottlePlan.timeMode==='limited'?numberField('bottlePlan.avgSets','平均セット数／人','',.1):''}${numberField('bottlePlan.share','利用者構成比','%',1)}</div>${state.bottlePlan.enabled&&state.bottlePlan.timeMode==='unlimited'?'<div class="row"><small class="hint">混雑時は一定時間ご利用後、退店をお願いする場合があります。</small></div>':''}</div><div class="section-title">ドリンク</div><div class="group">${state.drinks.map((x,i)=>itemCard(x,'drinks',i)).join('')}<button class="add" data-add="drinks">ドリンクを追加</button></div><div class="section-title">ショット</div><div class="group">${state.shots.map((x,i)=>itemCard(x,'shots',i)).join('')}<button class="add" data-add="shots">ショットを追加</button></div><div class="section-title">ボトル・シャンパン</div><div class="group">${state.bottles.map((x,i)=>itemCard(x,'bottles',i)).join('')}<button class="add" data-add="bottles">商品を追加</button></div><div class="section-title">オプション</div><div class="group">${state.options.map(optionCard).join('')}</div><div class="section-title">売上構成</div><div class="group"><div class="subfields three" style="padding-top:12px">${numberField('mix.set','セット','%',1)}${numberField('mix.drink','通常ドリンク','%',1)}${numberField('mix.shot','ショット','%',1)}${numberField('mix.bottle','ボトル・泡','%',1)}${numberField('mix.option','オプション','%',1)}</div><div class="row"><div class="grow"><span class="label">合計</span></div><b id="mixTotal">${mixTotal().toFixed(0)}%</b></div></div><div class="section-title">会計プレビュー</div><div class="group" id="billPreview"></div>`;renderBill()}
function renderPay(){document.getElementById('payPane').innerHTML=`<div class="section-title">セットバック</div><div class="group">${sw('setBack.enabled','セット売上にバック')}<div class="subfields ${state.setBack.enabled?'':'hidden'}"><div class="field"><label>方式</label><select data-bind="setBack.type"><option value="percent" ${state.setBack.type==='percent'?'selected':''}>売上率</option><option value="fixed" ${state.setBack.type==='fixed'?'selected':''}>1セットごと</option></select></div>${numberField('setBack.value','バック',state.setBack.type==='percent'?'%':'円',state.setBack.type==='percent'?1:50)}</div></div><div class="section-title">基本給与</div><div class="group">${sw('staffing.enabled','キャスト時給')}<div class="subfields ${state.staffing.enabled?'':'hidden'}">${numberField('staffing.wage','時給','円',50)}${numberField('staffing.hours','勤務時間／日','時間',.5)}${numberField('staffing.weekdayStaff','平日人数／日','人',1)}${numberField('staffing.weekdayDays','平日日数','日',1)}${numberField('staffing.weekendStaff','金土人数／日','人',1)}${numberField('staffing.weekendDays','金土日数','日',1)}</div></div><div class="section-title">店長</div><div class="group">${sw('manager.enabled','店長固定報酬')}${state.manager.enabled?rowNumber('manager.fixed','月額','円',10000):''}</div><div class="section-title">手当</div><div class="group">${state.allowances.map((x,i)=>genericItem(x,'allowances',i,'amount','円')).join('')}<button class="add" data-add="allowances">手当を追加</button></div><div class="section-title">大入り</div><div class="group">${sw('profitShare.enabled','利益分配')}<div class="subfields ${state.profitShare.enabled?'':'hidden'}">${numberField('profitShare.threshold','発動月商','円',100000)}${numberField('profitShare.reserve','店舗に残す利益','円',50000)}${numberField('profitShare.castRate','キャスト','%',1)}${numberField('profitShare.managerRate','店長','%',1)}</div>${state.profitShare.enabled?`<div class="row"><div class="grow"><span class="label">オーナー</span></div><b>${Math.max(0,100-state.profitShare.castRate-state.profitShare.managerRate)}%</b></div>`:''}</div><div class="notice good">商品ごとのバックは「料金」画面の商品カードで設定できます。</div>`}
function renderCost(){document.getElementById('costPane').innerHTML=`<div class="section-title">固定費</div><div class="group">${state.fixedCosts.map((x,i)=>genericItem(x,'fixedCosts',i,'amount','円')).join('')}<button class="add" data-add="fixedCosts">固定費を追加</button></div><div class="section-title">売上に連動する経費</div><div class="group">${state.variableCosts.map((x,i)=>genericItem(x,'variableCosts',i,'rate','%')).join('')}<button class="add" data-add="variableCosts">変動費を追加</button></div><p class="legal">Squareの対面決済手数料は、対象となる主要カードで2.5%、それ以外は3.25%〜。実際の適用率は契約条件によります。決済手数料は店舗負担として計算し、お客様の会計には加算しません。<a href="https://squareup.com/jp/ja/payments/pricing" target="_blank" rel="noopener">Square公式</a></p>`}
function mixTotal(){return Object.values(state.mix).reduce((a,b)=>a+n(b),0)}function activeItems(kind,filter){return state[kind].filter(x=>x.enabled&&(!filter||filter(x)))}function normalizedShares(rows,key='mix'){const total=rows.reduce((a,x)=>a+Math.max(0,n(x[key])),0);return rows.map(x=>total?Math.max(0,n(x[key]))/total:1/Math.max(1,rows.length))}function courseData(){const rows=[];if(state.standard.enabled)rows.push({key:'standard',...state.standard,avgSets:Math.max(.01,n(state.standard.avgSets))});if(state.bottlePlan.enabled)rows.push({key:'bottle',...state.bottlePlan,avgSets:state.bottlePlan.timeMode==='unlimited'?1:Math.max(.01,n(state.bottlePlan.avgSets))});const shares=normalizedShares(rows,'share');return rows.map((x,i)=>({...x,nshare:shares[i]}))}
function allocation(sales){const sum=mixTotal()||100,scale=100/sum,baseSales=state.priceMode==='service'?sales/(1+n(state.serviceRate)/100):sales,out={};Object.keys(state.mix).forEach(k=>out[k]=baseSales*n(state.mix[k])*scale/100);out.service=sales-baseSales;out.base=baseSales;return out}function category(kind,revenue,filter){const rows=activeItems(kind,filter).filter(x=>n(x.price)>0),shares=normalizedShares(rows);let cost=0,back=0;const details=rows.map((x,i)=>{const rev=revenue*shares[i],qty=rev/n(x.price),c=qty*n(x.cost);let b=0;if(x.backEnabled)b=x.backType==='percent'?rev*n(x.backValue)/100:qty*n(x.backValue);cost+=c;back+=b;return{name:x.name,qty,revenue:rev,cost:c,back:b}});return{cost,back,details,valid:revenue<=0||rows.length>0}}
function calculate(sales=state.target){const a=allocation(sales),courses=courseData(),avgCourse=courses.reduce((t,x)=>t+x.nshare*n(x.price)*x.avgSets,0),guests=avgCourse>0?a.set/avgCourse:0,setCounts={standard:0,bottle:0};courses.forEach(x=>setCounts[x.key]=guests*x.nshare*x.avgSets);let includedCost=0;activeItems('drinks',x=>x.mode==='included').forEach(x=>{let sets=0;if(x.scope==='standard'||x.scope==='both')sets+=setCounts.standard;if(x.scope==='bottle'||x.scope==='both')sets+=setCounts.bottle;includedCost+=sets*n(x.qtyPerSet)*n(x.cost)});const drink=category('drinks',a.drink,x=>x.mode==='paid'),shot=category('shots',a.shot),bottle=category('bottles',a.bottle),option=category('options',a.option);let setBack=0;if(state.setBack.enabled)setBack=state.setBack.type==='percent'?a.set*n(state.setBack.value)/100:(setCounts.standard+setCounts.bottle)*n(state.setBack.value);const productBack=drink.back+shot.back+bottle.back+option.back+setBack,wages=state.staffing.enabled?n(state.staffing.wage)*n(state.staffing.hours)*(n(state.staffing.weekdayStaff)*n(state.staffing.weekdayDays)+n(state.staffing.weekendStaff)*n(state.staffing.weekendDays)):0,manager=state.manager.enabled?n(state.manager.fixed):0,allowances=state.allowances.filter(x=>x.enabled).reduce((t,x)=>t+n(x.amount),0),fixed=state.fixedCosts.filter(x=>x.enabled).reduce((t,x)=>t+n(x.amount),0),variableRate=state.variableCosts.filter(x=>x.enabled).reduce((t,x)=>t+n(x.rate),0),variable=sales*variableRate/100,cogs=includedCost+drink.cost+shot.cost+bottle.cost+option.cost,preShare=sales-cogs-productBack-wages-manager-allowances-fixed-variable;let castBonus=0,managerBonus=0;if(state.profitShare.enabled&&sales>=n(state.profitShare.threshold)){const pool=Math.max(0,preShare-n(state.profitShare.reserve));castBonus=pool*n(state.profitShare.castRate)/100;managerBonus=pool*n(state.profitShare.managerRate)/100}const profit=preShare-castBonus-managerBonus,warnings=[];if(Math.abs(mixTotal()-100)>.01)warnings.push('売上構成は合計100%に換算して計算');if(!courses.length||avgCourse<=0)warnings.push('有効なセット料金がありません');if(!drink.valid)warnings.push('通常ドリンクの商品価格が未設定');if(!shot.valid)warnings.push('ショットの商品価格が未設定');if(!bottle.valid)warnings.push('ボトル・シャンパンの商品価格が未設定');if(!option.valid)warnings.push('オプション料金が未設定');return{sales,a,courses,guests,setCounts,includedCost,drink,shot,bottle,option,cogs,setBack,productBack,wages,manager,allowances,fixed,variableRate,variable,preShare,castBonus,managerBonus,profit,warnings}}
function breakEven(){let lo=0,hi=20000000;if(calculate(hi).preShare<0)return Infinity;for(let i=0;i<55;i++){const mid=(lo+hi)/2;if(calculate(mid).preShare>=0)hi=mid;else lo=mid}return hi}function renderSummary(){const r=calculate(),be=breakEven();document.getElementById('qBreakEven').textContent=Number.isFinite(be)?man(be):'算出不可';document.getElementById('qGuests').textContent=r.guests?(r.guests/Math.max(1,state.days)).toFixed(1)+'人':'—';const q=document.getElementById('qProfit');q.textContent=(r.profit<0?'−':'')+man(Math.abs(r.profit));q.style.color=r.profit<0?'var(--bad)':'var(--good)'}
function renderBill(){const box=document.getElementById('billPreview');if(!box)return;const courses=courseData(),course=courses.find(x=>x.key===state.bill.course)||courses[0];if(course&&!courses.find(x=>x.key===state.bill.course))state.bill.course=course.key;const people=Math.max(1,n(state.bill.people)),sets=course?(course.key==='bottle'&&state.bottlePlan.timeMode==='unlimited'?1:Math.max(1,n(state.bill.sets))):0;let subtotal=course?people*sets*n(course.price):0;const products=[...activeItems('drinks',x=>x.mode==='paid'),...activeItems('shots'),...activeItems('bottles')];products.forEach(x=>subtotal+=n(state.bill.items[x.id])*n(x.price));activeItems('options').forEach(x=>subtotal+=n(state.bill.options[x.id])*n(x.price));const service=state.priceMode==='service'?subtotal*n(state.serviceRate)/100:0,total=subtotal+service,tax=total*n(state.taxRate)/(100+n(state.taxRate));box.innerHTML=`<div class="subfields" style="padding-top:12px">${numberField('bill.people','人数','人',1)}<div class="field"><label>料金区分</label><select data-bind="bill.course">${courses.map(x=>`<option value="${x.key}" ${state.bill.course===x.key?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${course&&!(course.key==='bottle'&&state.bottlePlan.timeMode==='unlimited')?numberField('bill.sets','セット数','回',1):''}</div>${products.length||activeItems('options').length?`<div class="subfields">${products.map(x=>`<div class="field"><label>${esc(x.name)}</label><div class="unit"><input type="number" inputmode="numeric" data-bill-item="${x.id}" value="${n(state.bill.items[x.id])}" min="0" step="1">点</div></div>`).join('')}${activeItems('options').map(x=>`<div class="field"><label>${esc(x.name)}</label><div class="unit"><input type="number" inputmode="numeric" data-bill-option="${x.id}" value="${n(state.bill.options[x.id])}" min="0" step="1">件</div></div>`).join('')}</div>`:''}<div class="row"><div class="grow"><span class="label">小計</span></div><span class="value">${money(subtotal)}</span></div>${service?`<div class="row"><div class="grow"><span class="label">サービス料</span></div><span class="value">${money(service)}</span></div>`:''}<div class="row"><div class="grow"><b>お会計</b><small class="hint">内消費税 ${money(tax)}</small></div><b>${money(total)}</b></div>`}
function resultRow(label,value,total=false){return `<div class="row ${total?'total ':''}${value<0?'bad':'good'}"><div class="grow"><span class="label">${label}</span></div><span class="value">${value<0?'−':''}${money(Math.abs(value))}</span></div>`}function renderResults(){const p=document.getElementById('resultPane'),r=calculate(),be=breakEven(),day=Math.max(1,n(state.days)),cats=[['セット',r.a.set,r.setCounts.standard+r.setCounts.bottle],['通常ドリンク',r.a.drink,r.drink.details.reduce((t,x)=>t+x.qty,0)],['ショット',r.a.shot,r.shot.details.reduce((t,x)=>t+x.qty,0)],['ボトル・泡',r.a.bottle,r.bottle.details.reduce((t,x)=>t+x.qty,0)],['オプション',r.a.option,r.option.details.reduce((t,x)=>t+x.qty,0)]],details=[...r.drink.details,...r.shot.details,...r.bottle.details,...r.option.details];p.innerHTML=`<div class="result-hero"><small>月商 ${man(r.sales)} の想定</small><strong class="${r.profit>=0?'good':'bad'}">${r.profit<0?'−':''}${money(Math.abs(r.profit))}</strong><small>大入り分配後の店舗利益</small></div>${r.warnings.length?`<div class="notice warn">${r.warnings.join('／')}</div>`:''}<div class="metrics"><div class="metric"><small>損益分岐月商</small><b>${Number.isFinite(be)?man(be):'算出不可'}</b></div><div class="metric"><small>必要客数／月</small><b>${r.guests?r.guests.toFixed(0)+'人':'—'}</b></div><div class="metric"><small>必要客数／日</small><b>${r.guests?(r.guests/day).toFixed(1)+'人':'—'}</b></div><div class="metric"><small>通常セット／月</small><b>${r.setCounts.standard.toFixed(0)}回</b></div><div class="metric"><small>ボトルセット／月</small><b>${r.setCounts.bottle.toFixed(0)}回</b></div><div class="metric"><small>原価率</small><b>${pct(r.cogs/r.sales*100)}</b></div></div><div class="section-title">売上構成</div><div class="group table-scroll"><table class="simple-table"><tr><th>区分</th><th>月間</th><th>1日</th><th>必要数</th></tr>${cats.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td><td>${money(x[1]/day)}</td><td>${x[2]?x[2].toFixed(1):'—'}</td></tr>`).join('')}${r.a.service?`<tr><td>サービス料</td><td>${money(r.a.service)}</td><td>${money(r.a.service/day)}</td><td>—</td></tr>`:''}</table></div>${details.length?`<div class="section-title">商品別</div><div class="group table-scroll"><table class="simple-table"><tr><th>品目</th><th>必要数</th><th>売上</th><th>原価</th></tr>${details.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty.toFixed(1)}</td><td>${money(x.revenue)}</td><td>${money(x.cost)}</td></tr>`).join('')}</table></div>`:''}<div class="section-title">収支</div><div class="group breakdown">${resultRow('月間売上',r.sales)}${resultRow('商品原価',-r.cogs)}${resultRow('キャスト時給',-r.wages)}${resultRow('商品・セットバック',-r.productBack)}${resultRow('手当',-r.allowances)}${resultRow('店長固定報酬',-r.manager)}${resultRow('固定費',-r.fixed)}${resultRow(`変動費 ${pct(r.variableRate)}`,-r.variable)}${resultRow('分配前利益',r.preShare,true)}${r.castBonus?resultRow('キャスト大入り',-r.castBonus):''}${r.managerBonus?resultRow('店長大入り',-r.managerBonus):''}${resultRow('店舗利益',r.profit,true)}</div><div class="actions"><button data-export="csv">CSV保存</button><button data-print>PDF・印刷</button><button data-reset class="danger">初期化</button><button data-tab="price">料金を直す</button></div>`}
function add(kind){if(kind==='drinks')state.drinks.push({id:uid('drink'),enabled:true,name:'新しいドリンク',price:0,cost:0,mode:'paid',scope:'standard',qtyPerSet:1,mix:100,backEnabled:false,backType:'fixed',backValue:0});if(kind==='shots')state.shots.push({id:uid('shot'),enabled:true,name:'新しいショット',price:0,cost:0,mix:100,backEnabled:false,backType:'fixed',backValue:0});if(kind==='bottles')state.bottles.push({id:uid('bottle'),enabled:true,name:'新しいボトル',price:0,cost:0,mix:100,backEnabled:false,backType:'percent',backValue:0});if(kind==='allowances')state.allowances.push({id:uid('allow'),enabled:true,name:'新しい手当',amount:0});if(kind==='fixedCosts')state.fixedCosts.push({id:uid('fixed'),enabled:true,name:'新しい固定費',amount:0});if(kind==='variableCosts')state.variableCosts.push({id:uid('variable'),enabled:true,name:'新しい変動費',rate:0});save();renderAll()}
function csv(){const r=calculate(),rows=[['And G 収支シミュレーター',''],['月間売上',Math.round(r.sales)],['損益分岐',Math.round(breakEven())],['必要客数／月',r.guests.toFixed(1)],['必要客数／日',(r.guests/Math.max(1,state.days)).toFixed(1)],['商品原価',Math.round(r.cogs)],['キャスト時給',Math.round(r.wages)],['バック',Math.round(r.productBack)],['手当',Math.round(r.allowances)],['店長固定報酬',Math.round(r.manager)],['固定費',Math.round(r.fixed)],['変動費',Math.round(r.variable)],['分配前利益',Math.round(r.preShare)],['店舗利益',Math.round(r.profit)],[],['商品','必要数','売上','原価']];[...r.drink.details,...r.shot.details,...r.bottle.details,...r.option.details].forEach(x=>rows.push([x.name,x.qty.toFixed(1),Math.round(x.revenue),Math.round(x.cost)]));const data='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='AndG_収支シミュレーション.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function renderAll(){renderPrice();document.getElementById('pricePane').insertAdjacentHTML('afterbegin',renderPresetPanel());renderPay();renderCost();renderResults();renderSummary();showTab(active,false)}function showTab(tab,goTop=true){active=tab;document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.dataset.pane===tab));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));if(goTop)window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.bind){
  let v=el.type==='checkbox'?el.checked:el.value;if(el.type==='number'||el.type==='range')v=n(v);
  set(el.dataset.bind,v);document.querySelectorAll(`[data-bind="${el.dataset.bind}"]`).forEach(x=>{if(x!==el)x.value=v});save();
  renderSummary();renderResults();if(!el.dataset.bind.startsWith('bill.'))renderBill();
  const mt=document.getElementById('mixTotal');if(mt)mt.textContent=mixTotal().toFixed(0)+'%';
 }
 if(el.dataset.billItem){state.bill.items[el.dataset.billItem]=n(el.value);save()}
 if(el.dataset.billOption){state.bill.options[el.dataset.billOption]=n(el.value);save()}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.presetSelect!==undefined){loadPreset(el.value);return}
 if(el.dataset.presetImport!==undefined&&el.files?.[0]){importPresets(el.files[0]);el.value='';return}
 if(el.dataset.bind&&(el.type==='checkbox'||el.tagName==='SELECT')){set(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);save();renderAll();return}
 if(el.dataset.bind?.startsWith('bill.')||el.dataset.billItem||el.dataset.billOption)renderBill();
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.presetAction){const action=b.dataset.presetAction;if(action==='new')createPreset();if(action==='overwrite')overwritePreset();if(action==='duplicate')duplicatePreset();if(action==='rename')renamePreset();if(action==='delete')deletePreset();if(action==='export')exportPresets();if(action==='import')document.querySelector('[data-preset-import]').click();return}if(b.dataset.tab){showTab(b.dataset.tab);return}if(b.dataset.set){set(b.dataset.set,b.dataset.value);save();renderAll();return}if(b.dataset.add){add(b.dataset.add);return}if(b.dataset.remove){state[b.dataset.remove].splice(+b.dataset.index,1);save();renderAll();return}if(b.dataset.export==='csv'){csv();return}if(b.hasAttribute('data-print')){window.print();return}if(b.hasAttribute('data-reset')&&confirm('編集中の設定を初期化しますか？')){state=clone(DEFAULT);activePresetId='';localStorage.setItem(ACTIVE_PRESET_KEY,'');save();renderAll()}});
renderAll();
</script>
