<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0a0a0b">
  <title>And G ロゴ確認</title>
  <style>
    *{box-sizing:border-box}
    :root{--ink:#111214;--muted:#6f7175;--line:#dedede;--paper:#f4f4f2;--gold:#9d8252}
    html{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    body{margin:0}
    header{background:#090a0b;color:#f2f2ef;padding:36px 20px 32px;text-align:center}
    header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:40px;font-weight:500;letter-spacing:.025em}
    header p{margin:7px 0 0;color:#c9cacc;font-size:11px;letter-spacing:.38em}
    main{width:min(760px,100%);margin:auto;padding:26px 16px 120px}
    section{margin:0 0 34px}
    h2{margin:0 0 8px;font-size:18px}
    .help{margin:0 0 16px;color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:1fr;gap:15px}
    .design-card{display:block;border:2px solid transparent;border-radius:13px;background:#fff;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);cursor:pointer;transition:.15s}
    .design-card:has(input:checked){border-color:var(--gold);box-shadow:0 0 0 2px rgba(157,130,82,.16)}
    .design-check{position:absolute;opacity:0;pointer-events:none}
    .images{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ddd}
    .images img{display:block;width:100%;height:auto}
    .card-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-size:14px;letter-spacing:.08em}
    .tick{display:grid;place-items:center;width:23px;height:23px;border:1px solid #c9c9c9;border-radius:50%;color:transparent;font-size:14px}
    .design-card:has(input:checked) .tick{background:var(--gold);border-color:var(--gold);color:#fff}
    .choices{display:grid;gap:9px}
    .choice{display:flex;align-items:center;gap:11px;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer}
    .choice input{width:19px;height:19px;margin:0;accent-color:#8e7548}
    textarea{display:block;width:100%;min-height:112px;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;resize:vertical}
    .submit-wrap{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));background:rgba(244,244,242,.94);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.08)}
    button{display:block;width:min(728px,100%);margin:auto;border:0;border-radius:12px;background:#0a0a0b;color:#fff;padding:16px 20px;font:700 16px/1.2 inherit;cursor:pointer}
    button:active{transform:translateY(1px)}
    #status{display:none;margin:16px 0 0;padding:14px;border-radius:10px;background:#e8e5dd;font-size:14px;line-height:1.7;white-space:pre-wrap}
    #status.show{display:block}
    .error{color:#a42622;margin:10px 0 0;font-size:13px;min-height:1.2em}
    @media(max-width:430px){header{padding-top:30px}header h1{font-size:36px}main{padding-inline:10px}.grid{gap:8px}.card-foot{padding:9px 10px;font-size:12px}}
  </style>
</head>

      <section>
        <h2>2. 背景色</h2>
        <div class="choices">
          <label class="choice"><input type="radio" name="color" value="黒背景・銀文字" required>黒背景・銀文字</label>
          <label class="choice"><input type="radio" name="color" value="白背景・黒文字">白背景・黒文字</label>
          <label class="choice"><input type="radio" name="color" value="どちらでもよい">どちらでもよい</label>
        </div>
      </section>

      <section>
        <h2>3. この方向性について</h2>
        <div class="choices">
          <label class="choice"><input type="radio" name="direction" value="この方向で進めてOK" required>この方向で進めてOK</label>
          <label class="choice"><input type="radio" name="direction" value="少し調整して進めたい">少し調整して進めたい</label>
          <label class="choice"><input type="radio" name="direction" value="別方向も見たい">別方向も見たい</label>
        </div>
      </section>

      <section>
        <h2>4. ひとこと</h2>
        <p class="help">気になる点があれば入力してください（任意）</p>
        <textarea name="comment" maxlength="500" placeholder="例：＆をもう少し小さくしたい"></textarea>
        <div id="status" aria-live="polite"></div>
      </section>

      <div class="submit-wrap"><button type="submit">回答を送る</button></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('survey');
    const checks = [...document.querySelectorAll('.design-check')];
    const error = document.getElementById('design-error');
    const status = document.getElementById('status');

    checks.forEach(check => check.addEventListener('change', () => {
      const selected = checks.filter(item => item.checked);
      if (selected.length > 3) {
        check.checked = false;
        error.textContent = '選べるのは3つまでです';
      } else {
        error.textContent = '';
      }
    }));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const selected = checks.filter(item => item.checked).map(item => item.value);
      if (!selected.length) {
        error.textContent = '良いと思う案を1つ以上選んでください';
        document.querySelector('.grid').scrollIntoView({behavior:'smooth',block:'start'});
        return;
      }
      if (!form.reportValidity()) return;

      const data = new FormData(form);
      const comment = String(data.get('comment') || '').trim() || 'なし';
      const result = [
        'And G ロゴ確認',
        `候補：${selected.join('、')}`,
        `背景：${data.get('color')}`,
        `方向性：${data.get('direction')}`,
        `コメント：${comment}`
      ].join('\n');

      try {
        if (navigator.share) {
          await navigator.share({title:'And G ロゴ確認',text:result});
          status.textContent = '回答を共有しました。ありがとうございました。';
        } else {
          await navigator.clipboard.writeText(result);
          status.textContent = '回答をコピーしました。LINEなどに貼り付けて送ってください。\n\n' + result;
        }
      } catch (reason) {
        if (reason && reason.name === 'AbortError') return;
        status.textContent = '下の回答をコピーして送ってください。\n\n' + result;
      }
      status.classList.add('show');
      status.scrollIntoView({behavior:'smooth',block:'center'});
    });
  </script>
